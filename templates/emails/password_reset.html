<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <!-- Logo Header -->
  <div style="text-align: center; margin-bottom: 20px; padding: 20px 0;">
    <svg width="280" height="80" viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg" style="max-width: 100%; height: auto;">
      <!-- Large M -->
      <text x="10" y="65" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#000000">M</text>
      <!-- Vertical line -->
      <line x1="85" y1="10" x2="85" y2="70" stroke="#000000" stroke-width="2"/>
      <!-- MARBARAS text -->
      <text x="100" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000">MARBARAS</text>
      <!-- JEWELLERY COMPANY text -->
      <text x="100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="300" fill="#000000">JEWELLERY COMPANY</text>
    </svg>
  </div>
  
  <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; border-radius: 8px 8px 0 0;">
    <h1 style="color: white; margin: 0; font-size: 24px;">🔐 Password Reset</h1>
  </div>
  
  <div style="background: #f9f9f9; padding: 30px; border-radius: 0 0 8px 8px;">
    <p style="font-size: 16px;">Hello, {{ user.username }},</p>
    
    <p>We received a request to reset the password for your Marbaras account.</p>
    
    <div style="text-align: center; margin: 30px 0;">
      <a href="{{ reset_url }}" target="_blank" style="display: inline-block; background: #667eea; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">Reset Password</a>
    </div>
    
    <p style="color: #666; font-size: 14px;">Or copy this link into your browser:</p>
    <p style="background: #f0f0f0; padding: 10px; border-radius: 4px; word-break: break-all; font-size: 12px;">{{ reset_url }}</p>
    
    <p style="color: #999; font-size: 12px; margin-top: 30px;">If you did not request a password reset, please ignore this email.</p>
    
    <p style="margin-top: 30px; color: #666; font-size: 14px;">Best regards,<br>The Marbaras Team</p>
  </div>
</body>
</html>
